$schema: https://json-schema.org/draft/2020-12/schema
description: |
  Scheme Composition Report. Extends the generic cadastral report envelope with the scheme's member lots,
  how each is spatially represented, and a summary. It provides the `members` and
  `spatialRepresentationSummary` that the WA built-strata scope note says should be generated by a
  reporting transform.

  A `facts` stage report (source adapter output) holds source facts only: no `summary` and no member
  `spatiallyResolved`. A `complete` stage report (output of this block's `complete`) must carry both.
allOf:
  - $ref: bblocks://csdm.reporting.cadastral-report
  - type: object
    properties:
      reportType:
        const: csdm.reporting.reports.scheme-composition
      content:
        type: object
        required:
          - scheme
          - members
        properties:
          scheme:
            type: object
            required:
              - schemeNumber
            properties:
              schemeNumber:
                $ref: '#/$defs/TextValue'
              ref:
                $ref: bblocks://csdm.reporting.cadastral-report#SourceRef
          members:
            description: The scheme's member lots, ordered by lot number. May be empty.
            type: array
            items:
              type: object
              required:
                - lotNumber
                - geometryType
                - representationStatus
                - components
              properties:
                ref:
                  $ref: bblocks://csdm.reporting.cadastral-report#SourceRef
                lotNumber:
                  $ref: '#/$defs/TextValue'
                membershipEvidence:
                  type: array
                  items:
                    type: string
                geometryType:
                  description: The member's geometry (topology) type, for example AggregateSolid.
                  $ref: '#/$defs/TextValue'
                representationStatus:
                  description: How the member is spatially represented, as a code of the source (for example representation-status:d3d).
                  $ref: '#/$defs/TextValue'
                components:
                  description: The component solids the member references, and whether each is present in the source.
                  type: array
                  items:
                    type: object
                    required:
                      - ref
                      - found
                    properties:
                      ref:
                        $ref: bblocks://csdm.reporting.cadastral-report#SourceRef
                      found:
                        type: boolean
                spatiallyResolved:
                  description: Whether the member has components and every one is present (derived).
                  $ref: '#/$defs/BooleanValue'
          summary:
            description: The spatial representation summary of the scheme (derived by `complete`).
            type: object
            required:
              - memberParcelCount
              - geometryTypes
              - memberRepresentationStatuses
              - allMemberParcelsSpatiallyResolved
            properties:
              memberParcelCount:
                $ref: '#/$defs/DerivedCount'
              geometryTypes:
                $ref: '#/$defs/DerivedList'
              memberRepresentationStatuses:
                $ref: '#/$defs/DerivedList'
              allMemberParcelsSpatiallyResolved:
                $ref: '#/$defs/BooleanValue'
  - if:
      required:
        - stage
      properties:
        stage:
          const: complete
    then:
      properties:
        content:
          required:
            - summary
          properties:
            members:
              items:
                required:
                  - spatiallyResolved
    else:
      properties:
        content:
          not:
            required:
              - summary
          properties:
            members:
              items:
                not:
                  required:
                    - spatiallyResolved
$defs:
  DerivedCount:
    allOf:
      - $ref: bblocks://csdm.reporting.cadastral-report#ReportValue
      - properties:
          status:
            const: derived
          value:
            type: integer
            minimum: 0
  TextValue:
    allOf:
      - $ref: bblocks://csdm.reporting.cadastral-report#ReportValue
      - properties:
          value:
            type:
              - string
              - 'null'
  BooleanValue:
    allOf:
      - $ref: bblocks://csdm.reporting.cadastral-report#ReportValue
      - properties:
          status:
            const: derived
          value:
            type: boolean
  DerivedList:
    allOf:
      - $ref: bblocks://csdm.reporting.cadastral-report#ReportValue
      - properties:
          status:
            const: derived
          value:
            type: array
            items:
              type: string
