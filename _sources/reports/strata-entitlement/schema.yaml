$schema: https://json-schema.org/draft/2020-12/schema
description: |
  Strata Scheme Entitlement Report. Extends the generic cadastral report envelope with the scheme, its
  lots and their unit entitlements, the declared and calculated totals, and the basis of the schedule
  (the lodged schedule document, its approved form, the valuer's certification and the legislation).
  Stage 5 of the implementation plan: every value is a `ReportValue` carrying its status and provenance,
  and check results are recorded in `checks`.

  A `facts` stage report (source adapter output) holds source facts only and must not carry the derived
  totals (`calculated`, `lotCount`); a `complete` stage report (output of this block's `complete`
  transform) must carry them.
allOf:
  - $ref: bblocks://csdm.reporting.cadastral-report
  - type: object
    properties:
      reportType:
        const: csdm.reporting.reports.strata-entitlement
      content:
        type: object
        required:
          - scheme
          - lots
        properties:
          scheme:
            type: object
            required:
              - schemeNumber
            properties:
              schemeNumber:
                description: Scheme (plan) number, e.g. SP83687.
                allOf:
                  - $ref: bblocks://csdm.reporting.cadastral-report#ReportValue
                  - properties:
                      value:
                        type:
                          - string
                          - 'null'
                        minLength: 1
              schemeName:
                description: Name of the scheme.
                $ref: '#/$defs/TextValue'
              address:
                description: Address of the scheme.
                type: object
                properties:
                  parts:
                    description: The address parts as supplied, in order, with a label where one is needed.
                    type: array
                    items:
                      type: object
                      required:
                        - partType
                      properties:
                        partType:
                          description: Address part type (an IRI or CURIE, e.g. `apt:road`).
                          type: string
                        value:
                          description: The part's value as supplied (a literal, a code or an `@id` object).
                        label:
                          description: Human-readable label of a coded value (road name, locality name).
                          $ref: '#/$defs/TextValue'
                  formatted:
                    description: Single-line address, derived from the parts (e.g. "281 Belmont Avenue, Cloverdale").
                    $ref: '#/$defs/TextValue'
              ref:
                $ref: bblocks://csdm.reporting.cadastral-report#SourceRef
          lots:
            description: |
              One entry per member lot of the scheme, ordered by lot number. May be empty: a scheme whose
              members cannot be identified still produces a report, which its checks mark `invalid`.
            type: array
            items:
              type: object
              required:
                - lotNumber
                - entitlement
              properties:
                lotNumber:
                  description: Lot number as it appears in the source.
                  allOf:
                    - $ref: bblocks://csdm.reporting.cadastral-report#ReportValue
                    - properties:
                        value:
                          type:
                            - string
                            - 'null'
                entitlement:
                  description: Unit entitlement of the lot, a positive whole number.
                  allOf:
                    - $ref: bblocks://csdm.reporting.cadastral-report#ReportValue
                    - properties:
                        value:
                          type:
                            - integer
                            - 'null'
                          minimum: 1
                ref:
                  description: The lot parcel in the source (or, if it could not be found, the reference to it).
                  $ref: bblocks://csdm.reporting.cadastral-report#SourceRef
                membershipEvidence:
                  description: |
                    The source links that associate the lot with the scheme. The first is the authoritative
                    one that made it a member; the others corroborate it. Values are defined by the source
                    adapter (for the WA 3D CSDM: `references`, `containingPrimaryParcel`, `schemeRef`).
                  type: array
                  items:
                    type: string
          basis:
            description: What the unit entitlements rest on.
            type: object
            properties:
              schedule:
                description: The lodged schedule of unit entitlements.
                type: object
                required:
                  - documentRef
                properties:
                  documentRef:
                    description: The schedule document's `id` in the report's `documents`.
                    type: string
                  conformsTo:
                    description: The approved form the schedule follows (an IRI or CURIE).
                    type: string
              form:
                description: The approved form named by the schedule's `conformsTo`.
                type: object
                required:
                  - id
                properties:
                  id:
                    description: The form, as named by the source (an IRI or CURIE).
                    type: string
                  label:
                    $ref: '#/$defs/TextValue'
                  validFrom:
                    description: Date from which the form is approved for use.
                    $ref: '#/$defs/TextValue'
                  source:
                    description: Where the approved form is published.
                    $ref: '#/$defs/TextValue'
              certification:
                description: The licensed valuer's certification of the schedule.
                type: object
                required:
                  - annotationRef
                properties:
                  annotationRef:
                    description: The certification's `id` in the report's `annotations`.
                    type: string
                  certifier:
                    type: object
                    properties:
                      firstName:
                        $ref: '#/$defs/TextValue'
                      lastName:
                        $ref: '#/$defs/TextValue'
                      licensedValuerNumber:
                        $ref: '#/$defs/TextValue'
                  dateCertified:
                    $ref: '#/$defs/TextValue'
                  documentRef:
                    description: The document the certification links to (its `id` in `documents`), if any.
                    type: string
          legislativeBasis:
            description: The legislation the schedule is made under, as stated for its approved form.
            type: array
            items:
              $ref: '#/$defs/TextValue'
          totals:
            description: |
              The declared total (a source fact) and the derived values added by the `complete` transform.
            type: object
            properties:
              declared:
                description: Total unit entitlement declared by the source for the scheme.
                allOf:
                  - $ref: bblocks://csdm.reporting.cadastral-report#ReportValue
                  - properties:
                      value:
                        type:
                          - integer
                          - 'null'
                        minimum: 1
              calculated:
                description: Sum of the entitlements of all lots that have a usable one.
                allOf:
                  - $ref: '#/$defs/DerivedCount'
              lotCount:
                description: Number of member lots.
                allOf:
                  - $ref: '#/$defs/DerivedCount'
  - if:
      required:
        - stage
      properties:
        stage:
          const: complete
    then:
      properties:
        content:
          required:
            - totals
          properties:
            totals:
              required:
                - calculated
                - lotCount
    else:
      properties:
        content:
          properties:
            totals:
              not:
                anyOf:
                  - required:
                      - calculated
                  - required:
                      - lotCount
$defs:
  TextValue:
    description: A ReportValue whose value is text.
    allOf:
      - $ref: bblocks://csdm.reporting.cadastral-report#ReportValue
      - properties:
          value:
            type:
              - string
              - 'null'
            minLength: 1
  DerivedCount:
    allOf:
      - $ref: bblocks://csdm.reporting.cadastral-report#ReportValue
      - required:
          - value
        properties:
          status:
            const: derived
          value:
            type: integer
            minimum: 0
