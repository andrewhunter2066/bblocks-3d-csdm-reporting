$schema: https://json-schema.org/draft/2020-12/schema
description: |
  Generic cadastral report envelope. Report-type building blocks extend this schema and define
  `content`, using `ReportValue` for every value whose provenance matters, `Check` for every check result,
  and `DocumentReference` / `AnnotationReference` for the supporting documents and annotations the report
  relies on. Stage 5 of the implementation plan.
type: object
required:
  - reportType
  - stage
  - subject
  - sources
  - content
properties:
  reportType:
    description: Identifier of the report-type building block that defines `content`.
    type: string
    minLength: 1
  stage:
    description: |
      `facts`: source facts only, as produced by a source adapter. `complete`: derived values added by
      the report-type building block. Both stages share this schema; report types state which members
      each stage requires.
    enum:
      - facts
      - complete
  status:
    description: |
      Overall report status, set from the check results by the generic `summarise-checks` transform when
      the report is completed: `invalid` if any `error` check fails; otherwise `incomplete` if any
      `warning` check fails or any `error` check could not be evaluated; otherwise `complete`.
    enum:
      - complete
      - incomplete
      - invalid
  statusSummary:
    description: Counts behind `status`, recorded by `summarise-checks`.
    type: object
    properties:
      checks:
        type: integer
      failedErrors:
        type: integer
      failedWarnings:
        type: integer
      unevaluatedErrors:
        type: integer
  checks:
    description: Results of the checks run while generating the report (source adapter and report type).
    type: array
    items:
      $ref: '#/$defs/Check'
  generatedBy:
    description: Pipeline steps that produced this report, in order.
    type: array
    items:
      type: object
      required:
        - bblock
        - transform
      properties:
        bblock:
          type: string
        transform:
          type: string
  subject:
    description: The cadastral object the report is about (for example a strata scheme or a parcel).
    type: object
    required:
      - kind
      - ref
    properties:
      kind:
        description: Kind of subject, for example `strata-scheme`.
        type: string
      label:
        type: string
      ref:
        $ref: '#/$defs/SourceRef'
  sources:
    description: Source datasets the report was generated from.
    type: array
    minItems: 1
    items:
      $ref: '#/$defs/SourceDataset'
  documents:
    description: Supporting documents the report relies on (not every document of the source dataset).
    type: array
    items:
      $ref: '#/$defs/DocumentReference'
  annotations:
    description: Source annotations the report relies on (for example a certification).
    type: array
    items:
      $ref: '#/$defs/AnnotationReference'
  content:
    description: Report-type specific content, defined by the report-type building block.
    type: object
allOf:
  - if:
      required:
        - stage
      properties:
        stage:
          const: complete
    then:
      required:
        - status
        - checks
    else:
      not:
        required:
          - status
$defs:
  Check:
    $anchor: Check
    description: The result of one check on the source data or the report.
    type: object
    # JSON-LD: outcome and severity codes map to EARL outcomes and SHACL severities (see context.jsonld).
    x-jsonld-extra-terms:
      pass: http://www.w3.org/ns/earl#passed
      fail: http://www.w3.org/ns/earl#failed
      not-evaluated: http://www.w3.org/ns/earl#untested
      not-applicable: http://www.w3.org/ns/earl#inapplicable
      error: http://www.w3.org/ns/shacl#Violation
      warning: http://www.w3.org/ns/shacl#Warning
      info: http://www.w3.org/ns/shacl#Info
    required:
      - id
      - definedBy
      - category
      - severity
      - outcome
      - message
    properties:
      id:
        description: Identifier of the check, unique within the building block that defines it.
        type: string
        pattern: '^[a-z][a-z0-9-]*$'
      definedBy:
        description: Identifier of the building block that defines (and ran) the check.
        type: string
      category:
        description: |
          `source-conformance`: the source against its own profile. `generation`: what the report needs
          to be generated. `domain`: business rules of the report type.
        enum:
          - source-conformance
          - generation
          - domain
      severity:
        enum:
          - error
          - warning
          - info
      outcome:
        enum:
          - pass
          - fail
          - not-evaluated
          - not-applicable
      message:
        type: string
        minLength: 1
      targets:
        description: Pointers to the report values the check is about.
        type: array
        items:
          $ref: '#/$defs/ReportPointer'
      evidence:
        description: Small structured detail, for example the expected and actual values.
        type: object
  SourceRef:
    $anchor: SourceRef
    description: Reference to an object in a source dataset.
    type: object
    required:
      - dataset
      - pointer
    properties:
      dataset:
        description: Identifier of the source dataset (matches a `sources[].id`).
        type: string
      pointer:
        description: JSON Pointer (RFC 6901) to the object within the source dataset.
        type: string
        pattern: '^(/([^/~]|~[01])*)*$'
      id:
        description: Identifier of the object in the source dataset, when it has one.
        type: string
        x-jsonld-id: https://ogcincubator.github.io/bblocks-3d-csdm-reporting/def/cadastral-report/sourceObject
      property:
        description: |
          IRI of the source property the value was read from, as defined by the source dataset's own
          semantics (for example `https://w3id.org/ogc/ladm/parcels/entitlementPortion`). Given only when
          the source profile defines one.
        type: string
        format: iri
  SourceDataset:
    $anchor: SourceDataset
    description: |
      A source the report draws on: the cadastral dataset itself, or a vocabulary used to label its codes.
      `SourceRef.dataset` refers to `id`. For a vocabulary, `id` is the concept scheme IRI and a
      `SourceRef` names the concept in `id` (with an empty `pointer`).
    type: object
    required:
      - id
    properties:
      id:
        type: string
      kind:
        enum:
          - dataset
          - vocabulary
      name:
        type: string
      date:
        type: string
      conformsTo:
        description: Identifier of the profile or specification the dataset follows.
        type: string
  DocumentReference:
    $anchor: DocumentReference
    description: A supporting document referenced by the source dataset.
    type: object
    required:
      - id
      - href
      - sourceRef
    properties:
      id:
        description: Identifier of the document within this report (used by `documentRef`).
        type: string
        pattern: '^[A-Za-z][A-Za-z0-9._-]*$'
      title:
        type: string
      href:
        description: Link to the document, as given by the source (may be relative).
        type: string
      mediaType:
        type: string
      role:
        description: Role of the document, as given by the source (an IRI or CURIE).
        type: string
      conformsTo:
        description: Specification or approved form the document follows (an IRI or CURIE).
        type: string
      sourceRef:
        $ref: '#/$defs/SourceRef'
  AnnotationReference:
    $anchor: AnnotationReference
    description: An annotation of the source dataset (a statement made on the plan or survey).
    type: object
    required:
      - id
      - role
      - sourceRef
    properties:
      id:
        description: Identifier of the annotation within this report (used by `annotationRef`).
        type: string
        pattern: '^[A-Za-z][A-Za-z0-9._-]*$'
      role:
        description: Role of the annotation, as given by the source (an IRI or CURIE).
        type: string
      statement:
        description: The annotation text, verbatim.
        type: string
      href:
        type: string
      rel:
        type: string
      documentRef:
        description: The document in `documents` that the annotation links to, if any.
        type: string
      sourceRef:
        $ref: '#/$defs/SourceRef'
  ReportPointer:
    $anchor: ReportPointer
    description: JSON Pointer (RFC 6901) to a value within this report.
    type: string
    pattern: '^(/([^/~]|~[01])*)*$'
  ReportValue:
    $anchor: ReportValue
    description: |
      A report value together with its provenance and status. Report-type building blocks constrain
      `value` (for example to a positive integer); this definition fixes which provenance each status
      needs:

      | status | value | also required |
      |---|---|---|
      | `reported` | present | `sourceRefs`: where the value was read |
      | `derived` | present | `derivation`: method and the report values it was calculated from |
      | `documented` | present | `documentRef`: the supporting document it comes from |
      | `configured` | present | (a report-type constant) |
      | `not-supplied` | null or absent | (`sourceRefs`, when given, say where it was looked for) |
      | `unresolved` | null or absent | `sourceRefs`: the reference that could not be followed |
      | `invalid` | null or absent | `sourceRefs` and `lexicalValue`: the unusable value as supplied |
      | `conflicting` | null or absent | at least two `sourceRefs` that disagree |
    type: object
    required:
      - status
    properties:
      value:
        description: The value, or null when there is no usable value (see `status`).
      status:
        description: Where the value comes from, or why there is none. Codelist in this block's `data.ttl`.
        enum:
          - reported
          - derived
          - documented
          - configured
          - not-supplied
          - unresolved
          - invalid
          - conflicting
      sourceRefs:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/SourceRef'
      derivation:
        type: object
        required:
          - method
          - inputs
        properties:
          method:
            description: How the value was calculated, for example `sum` or `count`.
            type: string
            minLength: 1
          inputs:
            description: Pointers to the report values the calculation used.
            type: array
            items:
              $ref: '#/$defs/ReportPointer'
      documentRef:
        description: Identifier of the supporting document the value was obtained from.
        type: string
      lexicalValue:
        description: The value exactly as it appears in the source, when it differs from `value`.
        type: string
      note:
        type: string
    allOf:
      - if:
          properties:
            status:
              enum: [reported, derived, documented, configured]
        then:
          required:
            - value
          properties:
            value:
              not:
                type: 'null'
        else:
          properties:
            value:
              type: 'null'
      - if:
          properties:
            status:
              const: reported
        then:
          required:
            - sourceRefs
      - if:
          properties:
            status:
              const: derived
        then:
          required:
            - derivation
      - if:
          properties:
            status:
              const: documented
        then:
          required:
            - documentRef
      - if:
          properties:
            status:
              const: unresolved
        then:
          required:
            - sourceRefs
      - if:
          properties:
            status:
              const: invalid
        then:
          required:
            - sourceRefs
            - lexicalValue
      - if:
          properties:
            status:
              const: conflicting
        then:
          required:
            - sourceRefs
          properties:
            sourceRefs:
              minItems: 2
